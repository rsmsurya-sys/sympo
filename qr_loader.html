<!DOCTYPE html>
<html>
<head><title>QR Loader</title></head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>QR Image Base64 Generator</h2>
  <div id="status" style="font-weight: bold; color: blue;">Loading image...</div>
  <br>
  <img id="qrImage" src="file:///C:/Users/RSM_F/.gemini/antigravity-ide/brain/84365307-4ffc-4daf-a504-e7851754ff1b/media__1789809643673.png" style="max-width: 200px; border: 1px solid #ccc;">
  <br><br>
  <textarea id="b64" style="width: 100%; height: 300px; font-family: monospace;"></textarea>

  <script>
    const img = document.getElementById('qrImage');
    img.onload = function() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('b64').value = dataUrl;
        document.getElementById('status').innerText = 'SUCCESS_LENGTH_' + dataUrl.length;
        document.getElementById('status').style.color = 'green';
        localStorage.setItem('sympo_qr_b64', dataUrl);
      } catch(e) {
        document.getElementById('status').innerText = 'CANVAS_ERR: ' + e.message;
        document.getElementById('status').style.color = 'red';
      }
    };
    img.onerror = function() {
      document.getElementById('status').innerText = 'IMG_LOAD_ERR';
      document.getElementById('status').style.color = 'red';
    };
  </script>
</body>
</html>
