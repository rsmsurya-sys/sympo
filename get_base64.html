<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Image Saver</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Upload QR Code Image</h2>
  <input type="file" id="fileInput" accept="image/*">
  <br><br>
  <textarea id="output" style="width: 100%; height: 300px; font-family: monospace;"></textarea>
  <p id="status" style="color: green; font-weight: bold;"></p>

  <script>
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const b64 = event.target.result;
          output.value = b64;
          localStorage.setItem('qr_base64', b64);
          status.textContent = 'SAVED TO LOCALSTORAGE SUCCESSFULLY! Length: ' + b64.length;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
